name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Versions match .pre-commit-config.yaml and the [dev] extras
      - name: Install linters
        run: pip install black==24.10.0 ruff==0.14.0

      - name: Check formatting (black)
        run: black --check --diff dorothy/ tests/ scripts/ examples/

      - name: Lint (ruff)
        run: ruff check dorothy/ tests/ scripts/ examples/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU-only PyTorch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v
