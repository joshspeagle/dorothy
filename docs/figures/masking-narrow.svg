<svg xmlns="http://www.w3.org/2000/svg" class="dfig f-mask-n" viewBox="0 0 360 406" width="360" height="406" role="img" aria-labelledby="f-mask-n-title">
<title id="f-mask-n-title">The two masking augmentations on one illustrative batch of three stars. Input masking hides whole surveys of a star and blocks of pixels within the surveys it keeps; the blocks of one survey share their size and boundaries within the batch. Label masking hides whole label sources of a star and single labels within the sources it keeps. Every star keeps at least one survey, one block, one label source and one label.</title>
<style>
.dfig.f-mask-n text { font-family: var(--d-sans, "Hanken Grotesk", "Helvetica Neue", Helvetica, sans-serif); fill: currentColor; stroke: none; }
.dfig.f-mask-n .h { font-weight: 700; font-size: 13px; }
.dfig.f-mask-n .n { font-weight: 700; font-size: 12.5px; }
.dfig.f-mask-n .t { font-size: 12px; fill: var(--d-muted, #4A5675); }
.dfig.f-mask-n .mono { font-family: var(--d-mono, "JetBrains Mono", ui-monospace, monospace); font-size: 11px; fill: var(--d-muted, #4A5675); }
.dfig.f-mask-n .faint { fill: var(--d-faint, #5F6A85); }
.dfig.f-mask-n .lab { font-weight: 700; font-size: 12.5px; fill: var(--d-gold, #8C5D00); }
.dfig.f-mask-n .in { fill: var(--d-surface, #F1F4F9); stroke: var(--d-axis, #9AA5BC); stroke-width: 1; }
.dfig.f-mask-n .spec { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; }
.dfig.f-mask-n .goldm { fill: var(--d-gold-fill, #F2B84B); stroke: currentColor; stroke-width: 1; }
.dfig.f-mask-n .missing { fill: none; stroke: var(--d-axis, #9AA5BC); stroke-width: 1.2; stroke-dasharray: 4 3; }
.dfig.f-mask-n .arrow-missing { fill: none; stroke: var(--d-axis, #9AA5BC); stroke-width: 1.2; stroke-dasharray: 4 3; }
</style>
