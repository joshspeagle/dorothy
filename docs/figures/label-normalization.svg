<title id="f-lnorm-title">Label normalization: a histogram of an illustrative [Fe/H] distribution of training labels with two axes. On the physical axis in dex the median is −0.12 and the interquartile range is 0.39 dex; on the normalized axis the median is at 0 and the interquartile range spans one normalized unit.</title>
