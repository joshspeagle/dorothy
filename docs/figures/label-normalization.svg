.dfig.f-lnorm .tick { font-family: var(--d-mono, "JetBrains Mono", ui-monospace, monospace); font-size: 11.5px; fill: var(--d-faint, #5F6A85); }
.dfig.f-lnorm .goldf { fill: var(--d-gold-fill, #F2B84B); stroke: none; }
.dfig.f-lnorm .ax { fill: none; stroke: var(--d-axis, #9AA5BC); stroke-width: 1; }
.dfig.f-lnorm .arrow { fill: none; stroke: currentColor; stroke-width: 1.2; }
.dfig.f-lnorm .arrow-missing { fill: none; stroke: var(--d-axis, #9AA5BC); stroke-width: 1.2; stroke-dasharray: 4 3; }
</style>
