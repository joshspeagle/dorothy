.dfig.f-pred .goldl { fill: none; stroke: var(--d-gold-fill, #F2B84B); stroke-width: 1.5; stroke-dasharray: 3 3; }
.dfig.f-pred .ax { fill: none; stroke: var(--d-axis, #9AA5BC); stroke-width: 1; }
</style>
