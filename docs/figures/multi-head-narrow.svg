<svg xmlns="http://www.w3.org/2000/svg" class="dfig f-mh-n" viewBox="0 0 360 452" width="360" height="452" role="img" aria-labelledby="f-mh-n-title-n">
<title id="f-mh-n-title-n">The multi-head model: each survey's spectrum goes through its own encoder to a vector of fixed length; the vectors of the surveys a star has are concatenated or averaged, passed through shared layers, and one head per label source predicts the value and log-scatter of every parameter.</title>
<style>
.dfig.f-mh-n text { font-family: var(--d-sans, "Hanken Grotesk", "Helvetica Neue", Helvetica, sans-serif); fill: currentColor; stroke: none; }
.dfig.f-mh-n .h { font-weight: 700; font-size: 13px; }
.dfig.f-mh-n .n { font-weight: 700; font-size: 12.5px; }
.dfig.f-mh-n .t { font-size: 12px; fill: var(--d-muted, #4A5675); }
.dfig.f-mh-n .mono { font-family: var(--d-mono, "JetBrains Mono", ui-monospace, monospace); font-size: 11px; fill: var(--d-muted, #4A5675); }
.dfig.f-mh-n .math { font-family: var(--d-math, "KaTeX_Math", "Times New Roman", serif); font-style: italic; font-size: 15px; fill: var(--d-gold, #8C5D00); }
.dfig.f-mh-n .lab { font-weight: 700; font-size: 12.5px; fill: var(--d-gold, #8C5D00); }
.dfig.f-mh-n .in { fill: var(--d-surface, #F1F4F9); stroke: var(--d-axis, #9AA5BC); stroke-width: 1; }
.dfig.f-mh-n .spec { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; }
.dfig.f-mh-n .model { fill: var(--d-teal-tint, #DCEFEC); stroke: var(--d-teal, #1D7468); stroke-width: 1.5; }
.dfig.f-mh-n .vec { fill: var(--d-teal-fill, #2A9D8F); stroke: none; }
.dfig.f-mh-n .missing { fill: none; stroke: var(--d-axis, #9AA5BC); stroke-width: 1.2; stroke-dasharray: 4 3; }
.dfig.f-mh-n .missing-t { font-size: 12px; fill: var(--d-faint, #5F6A85); }
.dfig.f-mh-n .arrow { fill: none; stroke: currentColor; stroke-width: 1.2; }
.dfig.f-mh-n .arrow-missing { fill: none; stroke: var(--d-axis, #9AA5BC); stroke-width: 1.2; stroke-dasharray: 4 3; }
.dfig.f-mh-n .tip { fill: currentColor; }
.dfig.f-mh-n .tip-missing { fill: var(--d-axis, #9AA5BC); }
</style>
