<svg xmlns="http://www.w3.org/2000/svg" class="dfig f-pipe" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="f-pipe-title">
<title id="f-pipe-title">The DOROTHY pipeline: the super-catalogue gives the stars; load_training_data selects and splits them; spectra and labels are preprocessed; the Trainer fits the model and its calibration factors; the checkpoint feeds dorothy evaluate, which scores the test stars, and dorothy predict, which gives labels with uncertainties for new spectra. Evaluation and prediction reuse the same selection, split and preprocessing.</title>
<style>
.dfig.f-pipe text { font-family: var(--d-sans, "Hanken Grotesk", "Helvetica Neue", Helvetica, sans-serif); fill: currentColor; stroke: none; }
.dfig.f-pipe .h { font-weight: 700; font-size: 13px; }
.dfig.f-pipe .t { font-size: 12px; fill: var(--d-muted, #4A5675); }
.dfig.f-pipe .cmd { font-family: var(--d-mono, "JetBrains Mono", ui-monospace, monospace); font-weight: 600; font-size: 12px; }
.dfig.f-pipe .mono { font-family: var(--d-mono, "JetBrains Mono", ui-monospace, monospace); font-size: 11px; fill: var(--d-muted, #4A5675); }
.dfig.f-pipe .gold { fill: var(--d-gold, #8C5D00); }
.dfig.f-pipe .in { fill: var(--d-surface, #F1F4F9); stroke: var(--d-axis, #9AA5BC); stroke-width: 1; }
.dfig.f-pipe .model { fill: var(--d-teal-tint, #DCEFEC); stroke: var(--d-teal, #1D7468); stroke-width: 1.5; }
.dfig.f-pipe .arrow { fill: none; stroke: currentColor; stroke-width: 1.2; }
.dfig.f-pipe .arrow-missing { fill: none; stroke: var(--d-axis, #9AA5BC); stroke-width: 1.2; stroke-dasharray: 4 3; }
.dfig.f-pipe .tip { fill: currentColor; }
.dfig.f-pipe .tip-missing { fill: var(--d-axis, #9AA5BC); }
.dfig.f-pipe .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
</style>
<rect class="in" x="10" y="20" width="132" height="90"/>
<text class="h" x="76" y="42" text-anchor="middle">Catalogue</text>
<text class="t" x="76" y="61" text-anchor="middle">HDF5, one row</text>
<text class="t" x="76" y="77" text-anchor="middle">per star</text>
<text class="mono" x="76" y="97" text-anchor="middle">CatalogueLoader</text>
<rect class="in" x="164" y="20" width="132" height="90"/>
<text class="h" x="230" y="42" text-anchor="middle">Select and split</text>
<text class="t" x="230" y="61" text-anchor="middle">stars with a spectrum</text>
<text class="t" x="230" y="77" text-anchor="middle">and a valid label</text>
<text class="mono" x="230" y="97" text-anchor="middle">load_training_data</text>
<rect class="in" x="318" y="20" width="132" height="90"/>
<text class="h" x="384" y="42" text-anchor="middle">Preprocess</text>
<text class="t" x="384" y="61" text-anchor="middle">flux, ρ, mask;</text>
<text class="t" x="384" y="77" text-anchor="middle">normalized labels</text>
<text class="mono" x="384" y="97" text-anchor="middle">encode_precision</text>
<rect class="model" x="472" y="20" width="132" height="90"/>
<text class="h" x="538" y="42" text-anchor="middle">Train</text>
<text class="t" x="538" y="61" text-anchor="middle">fit μ and ln s,</text>
<text class="t" x="538" y="77" text-anchor="middle">then calibrate s</text>
<text class="mono" x="538" y="97" text-anchor="middle">Trainer</text>
<rect class="box" x="626" y="20" width="132" height="90"/>
<text class="h" x="692" y="42" text-anchor="middle">Checkpoint</text>
<text class="t" x="692" y="61" text-anchor="middle">weights, normalizer,</text>
<text class="t" x="692" y="77" text-anchor="middle">factors, split</text>
<text class="mono" x="692" y="97" text-anchor="middle">save_checkpoint</text>
<path class="arrow" d="M143 65L162 65"/><path class="tip" d="M162.0 65.0L155.0 68.2L155.0 61.8Z"/>
<path class="arrow" d="M297 65L316 65"/><path class="tip" d="M316.0 65.0L309.0 68.2L309.0 61.8Z"/>
<path class="arrow" d="M451 65L470 65"/><path class="tip" d="M470.0 65.0L463.0 68.2L463.0 61.8Z"/>
<path class="arrow" d="M605 65L624 65"/><path class="tip" d="M624.0 65.0L617.0 68.2L617.0 61.8Z"/>
<rect class="box" x="472" y="172" width="132" height="66"/>
<text class="cmd" x="538" y="194" text-anchor="middle">dorothy evaluate</text>
<text class="t" x="538" y="213" text-anchor="middle">metrics on the</text>
<text class="t" x="538" y="229" text-anchor="middle">test stars</text>
<rect class="box" x="626" y="172" width="132" height="66"/>
<text class="cmd" x="692" y="194" text-anchor="middle">dorothy predict</text>
<text class="t" x="692" y="213" text-anchor="middle">new spectra in,</text>
<text class="t gold" x="692" y="229" text-anchor="middle">labels μ ± c s out</text>
<path class="arrow" d="M692 111L692 170"/><path class="tip" d="M692.0 170.0L688.8 163.0L695.2 163.0Z"/>
<path class="arrow" d="M692 129L538 129L538 170"/><path class="tip" d="M538.0 170.0L534.8 163.0L541.2 163.0Z"/>
<path class="arrow-missing" d="M384.0 111V205.0H470"/>
<text class="t" x="378" y="174" text-anchor="end">same selection, split</text>
<text class="t" x="378" y="190" text-anchor="end">and preprocessing</text>
<path class="tip-missing" d="M470.0 205.0L463.0 208.2L463.0 201.8Z"/>
</svg>
