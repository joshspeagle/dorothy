<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="100%" role="img" aria-labelledby="pipeline-title" font-family="sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
  <title id="pipeline-title">The pipeline: cross-matched FITS files become the super-catalogue (build_catalogue_v2.py), which load_training_data turns into selected and split training data; the Trainer fits a model and saves a checkpoint, which dorothy evaluate scores on the test stars and dorothy predict uses for new spectra.</title>
  <defs>
    <marker id="pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <rect x="4.0" y="38.0" width="132.0" height="92.0" rx="6"/>
  <text x="70.0" y="62.0" font-size="13" text-anchor="middle" font-weight="bold" stroke="none" fill="currentColor">FITS files</text>
  <text x="70.0" y="82.0" font-size="11.5" text-anchor="middle" stroke="none" style="fill: var(--color-foreground-muted, #646776)">one per survey and</text>
  <text x="70.0" y="97.0" font-size="11.5" text-anchor="middle" stroke="none" style="fill: var(--color-foreground-muted, #646776)">label source</text>
  <text x="70.0" y="118.0" font-size="10" text-anchor="middle" font-family="monospace" stroke="none" style="fill: var(--color-brand-primary, #2757c4)">raw_catalogues/</text>
  <rect x="158.0" y="38.0" width="132.0" height="92.0" rx="6"/>
  <text x="224.0" y="62.0" font-size="13" text-anchor="middle" font-weight="bold" stroke="none" fill="currentColor">Super-catalogue</text>
  <text x="224.0" y="82.0" font-size="11.5" text-anchor="middle" stroke="none" style="fill: var(--color-foreground-muted, #646776)">HDF5 file, one</text>
  <text x="224.0" y="97.0" font-size="11.5" text-anchor="middle" stroke="none" style="fill: var(--color-foreground-muted, #646776)">row per star</text>
  <text x="224.0" y="118.0" font-size="10" text-anchor="middle" font-family="monospace" stroke="none" style="fill: var(--color-brand-primary, #2757c4)">build_catalogue_v2.py</text>
  <rect x="312.0" y="38.0" width="132.0" height="92.0" rx="6"/>
  <text x="378.0" y="62.0" font-size="13" text-anchor="middle" font-weight="bold" stroke="none" fill="currentColor">Training data</text>
  <text x="378.0" y="82.0" font-size="11.5" text-anchor="middle" stroke="none" style="fill: var(--color-foreground-muted, #646776)">selected stars,</text>
  <text x="378.0" y="97.0" font-size="11.5" text-anchor="middle" stroke="none" style="fill: var(--color-foreground-muted, #646776)">train/val/test split</text>
  <text x="378.0" y="118.0" font-size="10" text-anchor="middle" font-family="monospace" stroke="none" style="fill: var(--color-brand-primary, #2757c4)">load_training_data</text>
  <rect x="466.0" y="38.0" width="132.0" height="92.0" rx="6"/>
  <text x="532.0" y="62.0" font-size="13" text-anchor="middle" font-weight="bold" stroke="none" fill="currentColor">Model</text>
  <text x="532.0" y="82.0" font-size="11.5" text-anchor="middle" stroke="none" style="fill: var(--color-foreground-muted, #646776)">MLP or</text>
  <text x="532.0" y="97.0" font-size="11.5" text-anchor="middle" stroke="none" style="fill: var(--color-foreground-muted, #646776)">multi-head MLP</text>
  <text x="532.0" y="118.0" font-size="10" text-anchor="middle" font-family="monospace" stroke="none" style="fill: var(--color-brand-primary, #2757c4)">Trainer</text>
  <rect x="620.0" y="38.0" width="132.0" height="92.0" rx="6"/>
  <text x="686.0" y="62.0" font-size="13" text-anchor="middle" font-weight="bold" stroke="none" fill="currentColor">Checkpoint</text>
  <text x="686.0" y="82.0" font-size="11.5" text-anchor="middle" stroke="none" style="fill: var(--color-foreground-muted, #646776)">weights, config,</text>
  <text x="686.0" y="97.0" font-size="11.5" text-anchor="middle" stroke="none" style="fill: var(--color-foreground-muted, #646776)">normalizer, split</text>
  <text x="686.0" y="118.0" font-size="10" text-anchor="middle" font-family="monospace" stroke="none" style="fill: var(--color-brand-primary, #2757c4)">save_checkpoint</text>
  <line x1="139.0" y1="84.0" x2="155.0" y2="84.0" marker-end="url(#pipeline-arrow)"/>
  <line x1="293.0" y1="84.0" x2="309.0" y2="84.0" marker-end="url(#pipeline-arrow)"/>
  <line x1="447.0" y1="84.0" x2="463.0" y2="84.0" marker-end="url(#pipeline-arrow)"/>
  <line x1="601.0" y1="84.0" x2="617.0" y2="84.0" marker-end="url(#pipeline-arrow)"/>
  <path d="M650 133 L650 148 L532.0 148 L532.0 169" marker-end="url(#pipeline-arrow)"/>
  <line x1="706.0" y1="133.0" x2="706.0" y2="169.0" marker-end="url(#pipeline-arrow)"/>
  <rect x="466.0" y="172.0" width="132.0" height="46.0" rx="6" fill="currentColor" fill-opacity="0.06"/>
  <text x="532.0" y="191.0" font-size="11.5" text-anchor="middle" font-weight="bold" font-family="monospace" stroke="none" fill="currentColor">dorothy evaluate</text>
  <text x="532.0" y="208.0" font-size="11.5" text-anchor="middle" stroke="none" style="fill: var(--color-foreground-muted, #646776)">metrics and plots</text>
  <rect x="620.0" y="172.0" width="132.0" height="46.0" rx="6" fill="currentColor" fill-opacity="0.06"/>
  <text x="686.0" y="191.0" font-size="11.5" text-anchor="middle" font-weight="bold" font-family="monospace" stroke="none" fill="currentColor">dorothy predict</text>
  <text x="686.0" y="208.0" font-size="11.5" text-anchor="middle" stroke="none" style="fill: var(--color-foreground-muted, #646776)">labels for new spectra</text>
  <path d="M378.0 133 L378.0 195.0 L463 195.0" stroke-dasharray="5 4" marker-end="url(#pipeline-arrow)" stroke-opacity="0.6"/>
</svg>
