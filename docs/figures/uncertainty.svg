<svg xmlns="http://www.w3.org/2000/svg" class="dfig f-unc" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="f-unc-title">
<title id="f-unc-title">The two decoders of an output head. The label decoder reads the head input x and predicts mu. The error decoder reads x and u and predicts ln s. u is the log of the label source's reported label error, or the learned missing vector m. Training uses m for masked labels and for a random fraction of stars; validation, evaluation and prediction always use m.</title>
<style>
.dfig.f-unc text { font-family: var(--d-sans, "Hanken Grotesk", "Helvetica Neue", Helvetica, sans-serif); fill: currentColor; stroke: none; }
.dfig.f-unc .h { font-weight: 700; font-size: 13px; }
.dfig.f-unc .n { font-weight: 700; font-size: 12.5px; }
.dfig.f-unc .t { font-size: 12px; fill: var(--d-muted, #4A5675); }
.dfig.f-unc .math { font-family: var(--d-math, "KaTeX_Math", "Times New Roman", serif); font-style: italic; font-size: 15px; }
.dfig.f-unc .up { font-style: normal; }
.dfig.f-unc .gold { fill: var(--d-gold, #8C5D00); }
.dfig.f-unc .tealt { fill: var(--d-teal, #1D7468); }
.dfig.f-unc .in { fill: var(--d-surface, #F1F4F9); stroke: var(--d-axis, #9AA5BC); stroke-width: 1; }
.dfig.f-unc .model { fill: var(--d-teal-tint, #DCEFEC); stroke: var(--d-teal, #1D7468); stroke-width: 1.5; }
.dfig.f-unc .arrow { fill: none; stroke: currentColor; stroke-width: 1.2; }
.dfig.f-unc .tip { fill: currentColor; }
</style>
<rect class="in" x="20" y="118" width="104" height="46"/>
<text class="n" x="72" y="137" text-anchor="middle">head input</text>
<text class="math" x="72" y="155" text-anchor="middle">x</text>
<text class="t" x="72" y="88" text-anchor="middle">the trunk output, or</text>
<text class="t" x="72" y="104" text-anchor="middle">an MLP hidden layer</text>
<rect class="model" x="210" y="40" width="220" height="56"/>
<text class="h" x="320" y="62" text-anchor="middle">label decoder</text>
<text class="t" x="320" y="80" text-anchor="middle">reads x</text>
<rect class="model" x="210" y="160" width="220" height="56"/>
<text class="h" x="320" y="182" text-anchor="middle">error decoder</text>
<text class="t" x="320" y="200" text-anchor="middle">reads x and u</text>
<path class="arrow" d="M125 141H160"/>
<path class="arrow" d="M160 141L160 68L208 68"/><path class="tip" d="M208.0 68.0L201.0 71.2L201.0 64.8Z"/>
<path class="arrow" d="M160 141L160 188L208 188"/><path class="tip" d="M208.0 188.0L201.0 191.2L201.0 184.8Z"/>
<circle class="tip" cx="160" cy="141" r="2.5"/>
<path class="arrow" d="M432 68L470 68"/><path class="tip" d="M470.0 68.0L463.0 71.2L463.0 64.8Z"/>
<text class="math gold" x="480" y="73">μ</text>
<text class="t" x="500" y="73">the prediction; never reads u</text>
<path class="arrow" d="M432 188L470 188"/><path class="tip" d="M470.0 188.0L463.0 191.2L463.0 184.8Z"/>
<text class="math gold" x="480" y="193"><tspan class="up">ln </tspan>s</text>
<text class="t" x="512" y="193">log of the predicted scatter</text>
<rect class="model" x="296" y="248" width="48" height="32"/>
<text class="math" x="320" y="269" text-anchor="middle">u</text>
<path class="arrow" d="M320 247L320 218"/><path class="tip" d="M320.0 218.0L323.2 225.0L316.8 225.0Z"/>
<text class="math gold" x="150" y="255" text-anchor="end"><tspan class="up">ln </tspan>σ<tspan class="up" dy="4" font-size="11">y</tspan></text>
<text class="t" x="156" y="255">reported label error</text>
<text class="math tealt" x="150" y="281" text-anchor="end">m</text>
<text class="t" x="156" y="281">learned missing vector</text>
<path class="arrow" d="M270 251L294 258"/><path class="tip" d="M294.0 258.0L286.4 259.1L288.2 253.0Z"/>
<path class="arrow" d="M286 277L294 270"/><path class="tip" d="M294.0 270.0L290.8 277.0L286.6 272.2Z"/>
<text class="t" x="364" y="254">training: m for masked labels and for</text>
<text class="t" x="364" y="270">a random fraction of stars, else ln σ</text>
<text class="t" x="364" y="286">validation, evaluation, prediction: always m</text>
</svg>
