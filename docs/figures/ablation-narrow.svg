<svg xmlns="http://www.w3.org/2000/svg" class="dfig f-ablation-n" viewBox="0 0 360 434" width="360" height="434" role="img" aria-labelledby="f-ablation-n-title">
<title id="f-ablation-n-title">Ablation saliency: a block of pixels is zeroed at one position after another along the spectrum; each position gives a change of the prediction, and the importance of a pixel is the mean Fisher-weighted change over the blocks that cover it. The spectrum and the changes are illustrative.</title>
<style>
.dfig.f-ablation-n text { font-family: var(--d-sans, "Hanken Grotesk", "Helvetica Neue", Helvetica, sans-serif); fill: currentColor; stroke: none; }
.dfig.f-ablation-n .h { font-weight: 700; font-size: 13px; }
.dfig.f-ablation-n .t { font-size: 12px; fill: var(--d-muted, #4A5675); }
.dfig.f-ablation-n .math { font-family: var(--d-math, "KaTeX_Math", "Times New Roman", serif); font-style: italic; font-size: 14px; }
.dfig.f-ablation-n .in { fill: var(--d-surface, #F1F4F9); stroke: var(--d-axis, #9AA5BC); stroke-width: 1; }
.dfig.f-ablation-n .spec { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dfig.f-ablation-n .gone { fill: none; stroke: var(--d-axis, #9AA5BC); stroke-width: 1.2; stroke-dasharray: 4 3; }
.dfig.f-ablation-n .axis { fill: none; stroke: var(--d-axis, #9AA5BC); stroke-width: 1; }
.dfig.f-ablation-n .bar { fill: var(--d-teal-fill, #2A9D8F); stroke: none; }
.dfig.f-ablation-n .area { fill: var(--d-teal-fill, #2A9D8F); stroke: var(--d-teal, #1D7468); stroke-width: 1.5; stroke-linejoin: round; }
.dfig.f-ablation-n .arrow { fill: none; stroke: currentColor; stroke-width: 1.2; }
.dfig.f-ablation-n .tip { fill: currentColor; }
.dfig.f-ablation-n .guide { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 2 3; }
</style>
<text class="h" x="12" y="20">Spectrum</text>
<text class="t" x="12" y="36">one block of pixels zeroed</text>
<text class="h" x="12" y="186">Change of the prediction</text>
<text class="t" x="12" y="202">one bar per block position</text>
<text class="h" x="12" y="324">Importance</text>
<text class="t" x="12" y="340">per pixel: mean over the blocks that cover it</text>
