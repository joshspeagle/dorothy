.start-dist .arrow { fill: none; stroke: currentColor; stroke-width: 1.2; }
.start-dist .tip { fill: currentColor; }
.start-dist .model { fill: var(--d-teal-tint, #DCEFEC); stroke: var(--d-teal, #1D7468); stroke-width: 1.5; }
.start-dist .mline { fill: none; stroke: var(--d-teal, #1D7468); stroke-width: 1.5; }
.start-dist .mtip { fill: var(--d-teal, #1D7468); }
.start-dist .goldf { fill: var(--d-gold-fill, #F2B84B); stroke: var(--d-gold, #8C5D00); stroke-width: 1; }
</style>
