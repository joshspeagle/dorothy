<title id="f-spec-n-title">The model input of one spectrum: three channels on the survey's wavelength grid. Flux, normalized by its median and interquartile range; rho = ln(1 + 1/sigma), which is larger where the spectrum is more precise; and the mask, 1 at valid pixels. A run of invalid pixels, where the observed spectrum has no inverse variance, is 0 in all three channels. Illustrative spectrum.</title>
