<svg xmlns="http://www.w3.org/2000/svg" class="dfig start-res" viewBox="0 0 360 342" width="360" height="342" role="img" aria-labelledby="start-resolution-narrow-title">
<title id="start-resolution-narrow-title">The same stellar spectrum at high and low resolution: at high resolution each absorption line is resolved; at low resolution neighbouring lines blend into broad, shallow features. Illustrative.</title>
<style>
.start-res text { font-family: var(--d-sans, "Hanken Grotesk", "Helvetica Neue", Helvetica, sans-serif); fill: currentColor; stroke: none; }
.start-res .h { font-weight: 700; font-size: 13px; }
.start-res .n { font-weight: 700; font-size: 12.5px; }
.start-res .t { font-size: 12px; fill: var(--d-muted, #4A5675); }
.start-res .tick { font-family: var(--d-mono, "JetBrains Mono", ui-monospace, monospace); font-size: 11px; fill: var(--d-faint, #5F6A85); }
.start-res .mt { font-family: var(--d-math, "KaTeX_Math", "Times New Roman", serif); font-style: italic; font-size: 16px; fill: var(--d-teal, #1D7468); }
.start-res .mg { font-family: var(--d-math, "KaTeX_Math", "Times New Roman", serif); font-style: italic; font-size: 16px; fill: var(--d-gold, #8C5D00); }
.start-res .tt { font-size: 12px; fill: var(--d-teal, #1D7468); }
.start-res .tg { font-size: 12px; fill: var(--d-gold, #8C5D00); }
.start-res .in { fill: var(--d-surface, #F1F4F9); stroke: var(--d-axis, #9AA5BC); stroke-width: 1; }
.start-res .labbar { fill: var(--d-gold-tint, #FCF0D6); stroke: var(--d-gold-fill, #F2B84B); stroke-width: 1.5; }
.start-res .spec { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; }
.start-res .ax { fill: none; stroke: var(--d-axis, #9AA5BC); stroke-width: 1; }
.start-res .guide { fill: none; stroke: var(--d-axis, #9AA5BC); stroke-width: 1; stroke-dasharray: 4 3; }
.start-res .arrow { fill: none; stroke: currentColor; stroke-width: 1.2; }
.start-res .tip { fill: currentColor; }
.start-res .model { fill: var(--d-teal-tint, #DCEFEC); stroke: var(--d-teal, #1D7468); stroke-width: 1.5; }
.start-res .mline { fill: none; stroke: var(--d-teal, #1D7468); stroke-width: 1.5; }
.start-res .mtip { fill: var(--d-teal, #1D7468); }
.start-res .goldf { fill: var(--d-gold-fill, #F2B84B); stroke: var(--d-gold, #8C5D00); stroke-width: 1; }
</style>
<text class="h" x="0" y="18">High resolution: APOGEE, GALAH</text>
<text class="t" x="0" y="36">Each line is resolved, so a pipeline</text>
<text class="t" x="0" y="52">fits the labels to the lines.</text>
