<svg xmlns="http://www.w3.org/2000/svg" class="dfig" viewBox="0 0 760 342" width="760" height="342" role="img" aria-labelledby="ablation-title">
<title id="ablation-title">Ablation saliency: a block of pixels is zeroed at one position after another along the spectrum; each position gives a change of the prediction, and the importance of a pixel is the mean of the squared changes, scaled by the predicted scatter, over the blocks that cover it. The spectrum and the changes are illustrative.</title>
