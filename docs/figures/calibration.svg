<title id="f-cal-title">Three illustrative distributions of z-scores. With calibrated uncertainties they follow the standard normal distribution, whose robust spread is 1. An overconfident model has a wider distribution, spread above 1; an underconfident model has a narrower one, spread below 1.</title>
