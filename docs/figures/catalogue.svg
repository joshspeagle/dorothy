<svg xmlns="http://www.w3.org/2000/svg" class="dfig" viewBox="-20 -20 720 404" width="720" height="404" role="img" aria-labelledby="cat-title">
<title id="cat-title">The super-catalogue, illustrated with 12 stars: each row is one star, identified by its Gaia DR3 source ID. The columns are the spectra of DESI, BOSS, LAMOST LRS and LAMOST MRS and the labels of APOGEE and GALAH. A filled cell means the survey observed the star or the label source measured it; most cells are empty. One row is outlined: one star.</title>
<style>
.dfig text { font-family: var(--d-sans, "Hanken Grotesk", "Helvetica Neue", Helvetica, sans-serif); fill: currentColor; stroke: none; }
.dfig .h { font-weight: 700; font-size: 13px; }
.dfig .t { font-size: 12.5px; fill: var(--d-muted, #4A5675); }
.dfig .id { font-family: var(--d-mono, "JetBrains Mono", ui-monospace, monospace); font-size: 11.5px; fill: var(--d-faint, #5F6A85); }
.dfig .idh { font-family: var(--d-mono, "JetBrains Mono", ui-monospace, monospace); font-size: 11.5px; font-weight: 600; }
.dfig .note { font-weight: 600; font-size: 13px; }
.dfig .ill { font-style: italic; font-size: 12px; fill: var(--d-muted, #4A5675); }
.dfig .panel { fill: var(--d-surface, #F1F4F9); }
.dfig .spec { fill: var(--d-muted, #4A5675); }
.dfig .lab { fill: var(--d-gold-fill, #F2B84B); }
.dfig .empty { fill: none; stroke: var(--d-rule, #D3D9E4); stroke-width: 1; }
.dfig .bar-s { fill: var(--d-muted, #4A5675); }
.dfig .bar-l { fill: var(--d-gold-fill, #F2B84B); }
.dfig .hl { fill: none; stroke: currentColor; stroke-width: 2; }
.dfig .lead { fill: none; stroke: currentColor; stroke-width: 1.2; }
</style>
