site_name: DOROTHY
site_description: Stellar parameters, abundances and uncertainties from spectra with neural networks
site_url: https://joshspeagle.com/dorothy/
repo_url: https://github.com/joshspeagle/dorothy
repo_name: joshspeagle/dorothy
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Development notes are not part of the site
exclude_docs: |
  dev/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            extensions:
              - griffe_pydantic:
                  schema: false
            filters: ["!^_"]
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - User guide:
      - Super-catalogue: super_catalogue.md
      - Configuration: configuration.md
      - Training: training.md
      - Evaluation and prediction: evaluation.md
      - Analysis: analysis.md
      - Line spread functions: line_spread_functions.md
  - API reference:
      - api/index.md
      - Configuration: api/config.md
      - Data: api/data.md
      - Models: api/models.md
      - Losses: api/losses.md
      - Training: api/training.md
      - Inference: api/inference.md
      - Analysis: api/analysis.md
      - Visualization: api/visualization.md
  - Changelog: changelog.md
