[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dorothy"
version = "0.1.0"
description = "Deep learning framework for inferring stellar parameters from spectroscopic data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DOROTHY Team"}
]
keywords = ["astronomy", "spectroscopy", "deep-learning", "stellar-parameters"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "numpy>=2.0.0",
    "torch>=2.0.0",
    "astropy>=5.0.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "h5py>=3.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff==0.14.0",
    "mypy>=1.0.0",
    "black==24.10.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
dorothy = "dorothy.cli.main:main"

[project.urls]
Homepage = "https://github.com/joshspeagle/dorothy"
Documentation = "https://joshspeagle.com/dorothy/"
Repository = "https://github.com/joshspeagle/dorothy"

# Documentation site tools (pip install --group docs; pip >= 25.1). Pinned:
# MkDocs 1.x is frozen and Material caps it below 2.0.
[dependency-groups]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings==1.0.7",
    "mkdocstrings-python==2.0.9",
    "griffe-pydantic==1.3.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dorothy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Line length handled separately

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["dorothy"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
